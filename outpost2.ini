[Game]
; Outpost2: path to an Outpost 2 1.4.1 (OPU) install — game data is read from here
Outpost2=D:/opu/op2remake
GameSpeed=10
ScrollRate=10
; ScrollWindow: 1 = keep scrolling when the cursor leaves the window (OP2 default), 0 = stop at the window edge
ScrollWindow=1
; ScrollByMouse: 1 = window/mouse edge-scroll on, 0 = arrow-keys-only scrolling
ScrollByMouse=1
; Zoom: 1 = allow zooming out (mouse wheel), 0 = locked at normal zoom
Zoom=1
; StationaryShadows: 1 = buildings cast shadows, 0 = off
StationaryShadows=1
; MobileShadows: 1 = units/vehicles cast shadows, 0 = off
MobileShadows=1
; Name: player name
Name=Leviathan

[UI]
; SkinDir: directory of OP2 interface (HUD) bitmaps (Bitmap_*.bmp). The renderer
; color-keys each piece's #141414 background to transparent and draws it as the HUD
; frame. Points at YOUR own files (demo or retail interface graphics) - not bundled.
; Empty = use the hand-drawn frame only. Use FORWARD slashes.
SkinDir=D:/opu/op2remake/ui/op2
; UseSkin: 1 = draw the OP2 HUD bitmaps above, 0 = ignore them and use the original
; hand-drawn frame (the look from before the interface bitmaps were imported).
UseSkin=1
; AssetsDir: shared, skin-independent UI graphics (replaceable button PNGs etc.). The
; renderer color-keys #141414 to transparent here too. Use FORWARD slashes.
AssetsDir=D:/opu/op2remake/ui

[Render]
; AnimationSpeed: sprite animation ticks per game tick (higher = faster). Tune to match OP2.
AnimationSpeed=7
; AnimationGap: game ticks a building idles (paused on its base frame) between animation loops.
; Scales with game speed like the animation; ~32 ticks = 1 second at speed 10. 0 = loop continuously.
AnimationGap=60
; AnimationAmbientStructure: 1 = buildings play their idle/ambient animations, 0 = hold base frame
AnimationAmbientStructure=1
; AnimationAmbientUnit: 1 = idle military units slowly rotate their turret (OP2 "alive" look), 0 = static
AnimationAmbientUnit=1
; AnimationAmbientResource: 1 = Gaia map objects (ore beacons, magma vents, fumaroles, markers,
; wreckage) play their looping animation, 0 = hold base frame. Animates gently, scaled to game speed.
AnimationAmbientResource=1
; Overlay: 1 = draw the building "computer overlay" status light (OP2's green dot, top-left of
; each building). Green = Active; absent = Idle/off. 0 = no status lights.
Overlay=1

[Debug]
; Map: which map to load at startup, relative to <Outpost2>/OPU/maps/
; Use FORWARD slashes - Qt's INI reader treats backslashes as escapes.
Map=PlainsAndPasses/opu_12.opm
